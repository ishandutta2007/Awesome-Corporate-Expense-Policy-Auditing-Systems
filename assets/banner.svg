<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(0.98); }
      50% { opacity: 0.65; transform: scale(1.02); }
      100% { opacity: 0.35; transform: scale(0.98); }
    }
    @keyframes scanWave {
      0% { transform: translateX(-300px); opacity: 0; }
      30% { opacity: 0.7; }
      70% { opacity: 0.7; }
      100% { transform: translateX(1300px); opacity: 0; }
    }
    @keyframes badgeFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes badgeFloatRev {
      0% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
      100% { transform: translateY(0px); }
    }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .particle-delay-1 { animation-delay: 1.5s; }
    .particle-delay-2 { animation-delay: 3s; }
    .scanner { animation: scanWave 8s linear infinite; }
    .bg-pulse { transform-origin: 600px 180px; animation: pulseGlow 7s ease-in-out infinite; }
    .pill-1 { animation: badgeFloat 4.5s ease-in-out infinite; }
    .pill-2 { animation: badgeFloatRev 5.2s ease-in-out infinite; }
    .pill-3 { animation: badgeFloat 4.8s ease-in-out infinite; }
  </style>

  <!-- Deep background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="bg-pulse">
    <circle cx="200" cy="100" r="130" fill="#6366f1" filter="url(#glow)" opacity="0.18" />
    <circle cx="1000" cy="240" r="160" fill="#ec4899" filter="url(#glow)" opacity="0.15" />
    <circle cx="600" cy="180" r="180" fill="#8b5cf6" filter="url(#glow)" opacity="0.12" />
  </g>

  <!-- Moving Scanning Beam (Behind text) -->
  <g class="scanner">
    <rect x="0" y="2" width="220" height="356" fill="url(#primary-glow)" opacity="0.06" filter="url(#soft-glow)" />
    <line x1="220" y1="0" x2="220" y2="360" stroke="url(#primary-glow)" stroke-width="2" opacity="0.25" />
  </g>

  <!-- Animated Ambient Floating Particles -->
  <circle cx="120" cy="280" r="3.5" fill="#06b6d4" class="particle" />
  <circle cx="340" cy="70" r="2.5" fill="#a855f7" class="particle particle-delay-1" />
  <circle cx="920" cy="90" r="3" fill="#ec4899" class="particle particle-delay-2" />
  <circle cx="1060" cy="310" r="4" fill="#3b82f6" class="particle" />
  <circle cx="780" cy="330" r="2.5" fill="#10b981" class="particle particle-delay-1" />

  <!-- Animated Feature Badges / Pills (Upper & Lower margins, preserving center) -->
  <g class="pill-1">
    <g transform="translate(100, 36)">
      <rect width="210" height="34" rx="17" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#soft-glow)" />
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">REAL-TIME AUDITING</text>
    </g>
  </g>

  <g class="pill-2">
    <g transform="translate(870, 36)">
      <rect width="230" height="34" rx="17" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#soft-glow)" />
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">FINANCIAL RISK INTEL</text>
    </g>
  </g>

  <g class="pill-3">
    <g transform="translate(485, 304)">
      <rect width="230" height="32" rx="16" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="4.5" fill="#f59e0b" filter="url(#soft-glow)" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9" letter-spacing="0.5">ENTERPRISE SAAS &amp; OPEN SOURCE</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed sharp, clear & unobstructed -->
  <g id="foreground-text">
    <!-- Top Pill Category Header -->
    <text x="600" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2.5">
      FINTECH &amp; SPEND GOVERNANCE ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Expense Policy Auditing
    </text>

    <!-- Gradient Bar Underline -->
    <rect x="420" y="194" width="360" height="4" rx="2" fill="url(#primary-glow)" filter="url(#soft-glow)" />

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Real-Time Policy Enforcement • Anomaly Detection • Fraud Prevention • Spend Intelligence
    </text>
    
    <!-- Secondary Subtitle Note -->
    <text x="600" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Curated Leaderboards, Transparent SaaS Pricing, and Open-Source Rule Engines
    </text>
  </g>

  <!-- Modern Border Stroke -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#374151" stroke-width="1.5" />
</svg>
