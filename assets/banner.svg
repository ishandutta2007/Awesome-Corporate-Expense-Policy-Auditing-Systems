<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".8"/><stop offset="100%" stop-color="#111827" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-20px) translateX(15px);opacity:.8}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(.98)}50%{opacity:.65;transform:scale(1.02)}}@keyframes scanWave{0%{transform:translateX(-300px);opacity:0}30%,70%{opacity:.7}}@keyframes badgeFloat{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes badgeFloatRev{0%{transform:translateY(0)}50%{transform:translateY(6px)}}.particle{animation:floatParticle 6s ease-in-out infinite}.particle-delay-1{animation-delay:1.5s}.particle-delay-2{animation-delay:3s}.scanner{animation:scanWave 8s linear infinite}.bg-pulse{transform-origin:600px 180px;animation:pulseGlow 7s ease-in-out infinite}.pill-1{animation:badgeFloat 4.5s ease-in-out infinite}.pill-2{animation:badgeFloatRev 5.2s ease-in-out infinite}.pill-3{animation:badgeFloat 4.8s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><g class="bg-pulse"><circle cx="200" cy="100" r="130" fill="#6366f1" filter="url(#glow)" opacity=".18"/><circle cx="1000" cy="240" r="160" fill="#ec4899" filter="url(#glow)" opacity=".15"/><circle cx="600" cy="180" r="180" fill="#8b5cf6" filter="url(#glow)" opacity=".12"/></g><g class="scanner"><rect width="220" height="356" x="0" y="2" fill="url(#primary-glow)" filter="url(#soft-glow)" opacity=".06"/><line x1="220" x2="220" y1="0" y2="360" stroke="url(#primary-glow)" stroke-width="2" opacity=".25"/></g><circle cx="120" cy="280" r="3.5" fill="#06b6d4" class="particle"/><circle cx="340" cy="70" r="2.5" fill="#a855f7" class="particle particle-delay-1"/><circle cx="920" cy="90" r="3" fill="#ec4899" class="particle particle-delay-2"/><circle cx="1060" cy="310" r="4" fill="#3b82f6" class="particle"/><circle cx="780" cy="330" r="2.5" fill="#10b981" class="particle particle-delay-1"/><g class="pill-1"><g transform="translate(100, 36)"><rect width="210" height="34" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#soft-glow)"/><text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">REAL-TIME AUDITING</text></g></g><g class="pill-2"><g transform="translate(870, 36)"><rect width="230" height="34" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" opacity=".9" rx="17"/><circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#soft-glow)"/><text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">FINANCIAL RISK INTEL</text></g></g><g class="pill-3"><g transform="translate(485, 304)"><rect width="230" height="32" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" opacity=".9" rx="16"/><circle cx="18" cy="16" r="4.5" fill="#f59e0b" filter="url(#soft-glow)"/><text x="32" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing=".5">ENTERPRISE SAAS &amp; OPEN SOURCE</text></g></g><g id="foreground-text"><text x="600" y="115" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" text-anchor="middle">FINTECH &amp; SPEND GOVERNANCE ECOSYSTEM</text><text x="600" y="172" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Expense Policy Auditing</text><rect width="360" height="4" x="420" y="194" fill="url(#primary-glow)" filter="url(#soft-glow)" rx="2"/><text x="600" y="235" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing=".2" text-anchor="middle">Real-Time Policy Enforcement • Anomaly Detection • Fraud Prevention • Spend Intelligence</text><text x="600" y="262" fill="#94a3b8" font-family="-apple-syste